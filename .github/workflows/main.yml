name: main
on: push
permissions:
  contents: read
jobs:
  main:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      - name: Run build and test
        run: |
          set -x
          npm install
          npm run build
          npm test
