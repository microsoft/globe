name: main
on: push
permissions:
  contents: read
jobs:
  main:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run build and test
        run: |
          set -x
          npm install
          npm run build
          npm test
